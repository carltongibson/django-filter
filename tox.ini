[tox]
envlist =
       {py310, py311, py312, py313, py314}-django52,
       {py312, py313, py314}-django60,
       {py312, py313, py314}-django61,
       {py312, py313, py314}-latest,
       isort,lint,docs,warnings,
isolated_build = true


[latest]
deps =
    https://github.com/django/django/archive/main.tar.gz
    https://github.com/encode/django-rest-framework/archive/master.tar.gz

[testenv]
commands = coverage run --parallel-mode --source django_filters ./runtests.py --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner {posargs}
setenv =
       PYTHONDONTWRITEBYTECODE=1
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0a1,<6.1
    django61: Django>=6.1a1,<6.2
    !latest-!django61: djangorestframework
    # Released DRF (<3.18) is incompatible with Django 6.1: it imports
    # cc_delim_re from django.utils.cache, which 6.1 removed. Use DRF main
    # until 3.18 is released, then drop the next line and add django61 back
    # to the plain `!latest: djangorestframework` factor above.
    django61: https://github.com/encode/django-rest-framework/archive/master.tar.gz
    latest: {[latest]deps}
    -r requirements/test-ci.txt

[testenv:isort]
commands = isort --check-only --diff django_filters tests {posargs}
deps = isort

[testenv:lint]
commands = flake8 django_filters tests {posargs}
deps = flake8

[testenv:docs]
commands = sphinx-build -WE docs _docs
deps =
    -rrequirements/docs.txt

[testenv:warnings]
ignore_outcome = True
unignore_outcomes = True
commands = python -Werror ./runtests.py --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner {posargs}
deps =
    {[latest]deps}
    -rrequirements/test-ci.txt
